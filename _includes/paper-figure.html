<a class="{{ include.class_name }}" href="{{ include.src | relative_url }}" target="_blank" rel="noopener" aria-label="View figure for {{ include.label | escape }}">
  <picture>
    {% if include.preview %}
    <source srcset="{{ include.preview | relative_url }}" type="image/webp">
    {% endif %}
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: '' | escape }}" loading="lazy" decoding="async">
  </picture>
</a>
