<a class="{{ include.class_name }}" href="{{ include.src | relative_url }}" target="_blank" rel="noopener" aria-label="View figure for {{ include.label | escape }}"{% if include.viewer %} data-research-preview="image"{% endif %}>
  <picture>
    {% if include.preview %}
    <source srcset="{{ include.preview | relative_url }}" type="image/webp">
    {% endif %}
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: '' | escape }}" loading="lazy" decoding="async">
  </picture>
  {% if include.viewer %}
  <span class="paper-figure__expand" aria-hidden="true"><i class="fas fa-expand"></i></span>
  {% endif %}
</a>
