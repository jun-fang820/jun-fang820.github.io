<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="masthead__brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
    <nav class="masthead__nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title | escape }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
