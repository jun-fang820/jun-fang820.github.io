<svg xmlns="http://www.w3.org/2000/svg" width="480" height="86" viewBox="0 0 480 86">
  <title>Earinter signal study</title>
  <desc>The envelope of a chewing trace in the Earinter reasoning figure, redrawn over a plate silhouette.</desc>
  <defs>
    <pattern id="sensing-paper-dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="0.7" cy="2.1" r="0.35" fill="#85533a" opacity=".25"/>
      <circle cx="3.5" cy="4.4" r="0.25" fill="#85533a" opacity=".18"/>
    </pattern>
    <pattern id="sensing-ink-dots" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="0.9" cy="1.1" r=".38" fill="#f6e7d2" opacity=".48"/>
    </pattern>
    <ellipse id="sensing-rim" cx="291" cy="54" rx="114" ry="64" transform="rotate(-22 291 54)"/>
    <clipPath id="sensing-plate">
      <ellipse cx="291" cy="54" rx="114" ry="64" transform="rotate(-22 291 54)"/>
    </clipPath>
    <!-- Redrawn from the Earinter reasoning panel, with gaps at the timing marks joined. -->
    <path id="sensing-trace" data-plate-signal="" d="M16 64.4 L28.1 64.4 L45 59.4 L49.9 59.4 L64.4 63.8 L78.9 63.8 L91 62.5 L100.7 53.8 L110.3 31.5 L112.8 29.7 L117.6 36.5 L122.4 48.3 L127.3 56.3 L129.7 59.4 L134.5 62.5 L141.8 64.4 L153.9 64.4 L175.7 60 L199.8 63.8 L216.8 63.8 L221.6 61.3 L224 56.9 L236.1 21 L238.5 16.6 L241 16 L245.8 25.2 L262.7 58.2 L267.6 62.5 L272.4 63.8 L284.5 63.8 L303.9 61.3 L320.8 63.1"/>
    <linearGradient id="sensing-readout-wash">
      <stop offset="0" stop-color="#fff3e6" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff3e6" stop-opacity=".48"/>
    </linearGradient>
  </defs>
  <rect width="480" height="86" fill="url(#sensing-paper-dots)"/>
  <path d="M18 13H148 M18 73H462" fill="none" stroke="#875342" stroke-width=".55" opacity=".4"/>
  <g transform="translate(66 0)">
    <use href="#sensing-rim" fill="#a35a44" stroke="#864333" stroke-width="1.1"/>
    <use href="#sensing-rim" fill="url(#sensing-ink-dots)"/>
    <ellipse cx="291" cy="54" rx="86" ry="43" transform="rotate(-22 291 54)"
      fill="#b9785f" stroke="#f4d7bc" stroke-width=".85" stroke-opacity=".78"/>
    <ellipse cx="291" cy="54" rx="78" ry="36" transform="rotate(-22 291 54)"
      fill="none" stroke="#f4d7bc" stroke-width=".6" stroke-opacity=".48"/>
    <use href="#sensing-trace" fill="#ad6148" fill-opacity=".2"/>
    <use href="#sensing-trace" fill="none" stroke="#7e3628" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    <g clip-path="url(#sensing-plate)">
      <use href="#sensing-trace" fill="none" stroke="#fff0dc" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="16" cy="64.4" r="1.55" fill="#7e3628"/>
    <g class="research-plate-readout" data-plate-readout="" transform="translate(16 0)">
      <rect x="-23" y="7" width="23" height="71" fill="url(#sensing-readout-wash)"/>
      <path d="M0 8V77" stroke="#773c2d" stroke-width=".85" opacity=".62"/>
      <circle data-plate-point="" cy="64.4" r="3.1" fill="#fff3e6" stroke="#7e3628" stroke-width="1.2"/>
    </g>
  </g>
</svg>
