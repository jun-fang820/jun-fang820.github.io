<svg xmlns="http://www.w3.org/2000/svg" width="480" height="86" viewBox="0 0 480 86">
  <title>Behavior change study</title>
  <desc>Repeated meal-photo frames with a single offset cue, evoking routines and timely support.</desc>
  <defs>
    <g id="behavior-exposure">
      <ellipse cx="-2" cy="-1" rx="24" ry="14" transform="rotate(-17)" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <ellipse cx="-2" cy="-1" rx="16" ry="8.5" transform="rotate(-17)" fill="none" stroke="currentColor" stroke-width=".7" opacity=".75"/>
      <path d="M-28-12v-6h6 M22-18h6v6 M28 11v6h-6 M-22 17h-6v-6" fill="none" stroke="currentColor" stroke-width=".75"/>
    </g>
    <g id="behavior-frame">
      <rect x="-37" y="-25" width="74" height="50" fill="#a35a44" fill-opacity=".045" stroke="#a2604a" stroke-width=".9"/>
      <path d="M-37 12h74" stroke="#ac745c" stroke-width=".55" opacity=".55"/>
      <use href="#behavior-exposure" color="#9c563f"/>
    </g>
  </defs>
  <path d="M18 73H462" fill="none" stroke="#875342" stroke-width=".65" opacity=".25"/>
  <g transform="translate(66 0)">
    <use href="#behavior-frame" transform="translate(71 45) rotate(-11)" opacity=".5"/>
    <use href="#behavior-frame" transform="translate(147 44) rotate(6)" opacity=".76"/>
    <g class="research-plate-exposure">
      <rect x="194" y="19" width="77" height="52" fill="#a35a44" fill-opacity=".08" transform="rotate(5 232 45)"/>
      <g transform="translate(229 43) rotate(-5)">
        <rect x="-38" y="-26" width="76" height="52" fill="#a35a44" fill-opacity=".15" stroke="#a35a44" stroke-width="1.1"/>
        <use href="#behavior-exposure" color="#85432e"/>
      </g>
    </g>
    <g class="research-plate-cue">
      <path d="M272 27h17" stroke="#8d4836" stroke-width=".8"/>
      <circle cx="296" cy="27" r="5.7" fill="#ad6650" stroke="#f6e9d9" stroke-width="1.3"/>
    </g>
  </g>
</svg>
