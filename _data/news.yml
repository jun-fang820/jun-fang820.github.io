- date: "2026-10"
  text: >-
    Honored to be supported by **China Association for Science and Technology's Young Elite Scientists Sponsorship Program** (Doctoral Student Special Project)!
- date: "2026-07"
  text: >-
    Our research paper, [Earinter: A Closed-Loop System for Eating Pace Regulation with Just-in-Time Intervention Using Commodity Earbuds](https://dl.acm.org/doi/10.1145/3831629), has been accepted by [IMWUT'26](https://dl.acm.org/journal/imwut).
- date: "2026-01"
  text: >-
    Our dataset paper, Capturing Chewing and Swallowing with Earables: A Multimodal Dataset Across Contexts, has been accepted by [CHI'26 Workshop](https://everydaywearableforhealth.github.io/).
- date: "2025-08"
  text: >-
    Our survey paper, [A Review of Behavioral Closed-Loop Paradigm from Sensing to Intervention for Ingestion Health](https://dl.acm.org/doi/10.1145/3770668), has been accepted by [IMWUT'25](https://dl.acm.org/journal/imwut).
- date: "2024-09"
  text: >-
    Joined the [Pervasive Interaction Lab](https://pi.cs.tsinghua.edu.cn/), and restarted a new chapter of my Ph.D. journey.
- date: "2023-09"
  text: Started my Ph.D. in the Department of Computer Science and Technology at Tsinghua University.
- date: "2023-06"
  text: Received my B.S. from the Department of Automation at Tsinghua University.
