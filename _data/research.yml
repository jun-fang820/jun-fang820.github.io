# Homepage selection: first/co-first-authored main-track or journal papers.
# Full preprints are also allowed when explicitly labeled Preprint.
- id: wearable-sensing
  aliases: [eating-and-closed-loop]
  title: Wearable Sensing for Ingestion Health
  short_title: Wearable Sensing
  artwork: research-art/sensing.svg
  description: How can wearables capture eating behavior and related physiological and contextual signals in everyday life?
  papers:
    - name: Earinter
      title: >-
        Earinter: A Closed-Loop System for Eating Pace Regulation with Just-in-Time Intervention Using Commodity Earbuds
      summary: Sensing eating pace through everyday earbuds to offer timely feedback during meals.
      venue: IMWUT 2026
      demo: earinter
      image:
        src: /images/earinter.PNG
        webp: /images/earinter-home.webp
        alt: Earinter uses earbud sensing to deliver feedback during meals.
      links:
        - label: Paper
          url: https://dl.acm.org/doi/10.1145/3831629
        - label: Video
          url: /video/earinter/IMWUT-Feb262705-teaser.mp4
          viewer: video
          poster: /video/earinter/IMWUT-Feb262705-teaser-%E5%B0%81%E9%9D%A2.jpg
          captions: /video/earinter/IMWUT-Feb262705-teaser.vtt
    - name: Ingestion Health Review
      title: A Review of Behavioral Closed-Loop Paradigm from Sensing to Intervention for Ingestion Health
      summary: A review of how sensing, reasoning, and intervention connect in systems for ingestion health.
      venue: IMWUT 2025
      demo: ingestion-loop
      image:
        src: /images/Behavior_survey.jpg
        webp: /images/behavior-survey-home.webp
        alt: Diagram connecting eating behavior, sensing, reasoning, and intervention in a closed loop.
      links:
        - label: Paper
          url: https://dl.acm.org/doi/10.1145/3770668
- id: behavior-change
  aliases: [habits-and-behavior-change]
  title: Behavior Change & Intervention
  short_title: Behavior Change
  artwork: research-art/behavior.svg
  description: How can interactive systems support decisions in the moment and help people build routines over time?
  papers:
    - name: Pre-Meal Photo Capture
      title: >-
        Supporting Habit Formation in Pre-Meal Photo Capture: A Longitudinal Study of Behavior Change Techniques
      summary: A longitudinal study of what helps people build a habit of taking photos before meals.
      status: Preprint
      demo: meal-capture
      image:
        src: /images/premeal_habit.png
        webp: /images/premeal-habit-home.webp
        alt: Prompts, reflection, and social support for a pre-meal photo habit.
      links:
        - label: arXiv
          url: https://arxiv.org/abs/2611.02983
    - name: StoryEcho
      title: >-
        StoryEcho: A Generative Child-as-Actor Storytelling System for Picky-Eating Intervention
      summary: Personalized stories that respond to how children explore foods during real meals.
      status: Preprint
      demo: story-echo
      image:
        src: /images/storyecho.png
        webp: /images/storyecho-home.webp
        alt: StoryEcho connects a story starring the child with exploring foods at mealtime.
      links:
        - label: arXiv
          url: https://arxiv.org/abs/2604.08114
- id: well-being
  aliases: [reflection-and-well-being]
  title: Everyday Well-Being
  short_title: Well-Being
  artwork: research-art/well-being.svg
  description: How can interactive systems help people reflect on everyday experiences and support their well-being?
  papers:
    - name: LaughAnchor
      title: Reconstruction and Reflection of Positive Experiences through Resurfacing Laughter-indexed Everyday Moments
      summary: Using moments of laughter to help people revisit and reflect on positive everyday experiences.
      status: Preprint
      demo: laugh-anchor
      image:
        src: /images/laughanchor.png
        webp: /images/laughanchor-home.webp
        alt: LaughAnchor uses moments of laughter to help people revisit positive experiences.
      links:
        - label: arXiv
          url: https://arxiv.org/abs/2609.12642
